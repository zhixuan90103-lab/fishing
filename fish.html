<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>鲷鱼预览</title>
    <style>
      html, body { margin: 0; height: 100%; background: #1a1c1f; color: #e8eaed; font: 14px/1.4 sans-serif; }
      #view { display: block; width: 100vw; height: 100vh; touch-action: none; }
      #bar {
        position: fixed; left: 12px; top: 12px; display: flex; gap: 12px; align-items: center;
        padding: 8px 12px; background: rgba(0,0,0,.45); border-radius: 8px;
      }
      #bar input { width: 140px; }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="bar">
      <span id="status">加载中…</span>
      <label>游速 <input id="rate" type="range" min="0.2" max="2.5" step="0.05" value="1" /></label>
      <b id="rate-label">1.00</b>
      <label>发力 <input id="drive" type="range" min="0" max="1.3" step="0.05" value="0.55" /></label>
      <label>弯身 <input id="bend" type="range" min="-0.6" max="0.6" step="0.02" value="0" /></label>
    </div>
    <script type="module" src="./src/fish/preview.js"></script>
  </body>
</html>
